<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LPG Bulk Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Colors/tokens match c:\crm-app\assets\style.css (the CRM Portal design system) */
  :root {
    --c-accent:       #4f46e5;
    --c-accent-hover: #4338ca;
    --c-accent-light: #ede9fb;
    --c-accent-glow:  rgba(79,70,229,.25);
    --c-success:      #10b981; --c-success-bg: rgba(16,185,129,.12);
    --c-danger:       #f87171; --c-danger-bg:  rgba(248,113,113,.12); --c-danger-border: rgba(248,113,113,.4);
    --c-bg:        #eeeef6;
    --c-surface:   #ffffff;
    --c-surface-2: #eeeef6;
    --c-border:    #e0e0e0;
    --c-text:      #333333;
    --c-text-muted:#555555;
    --c-text-soft: #999999;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.08);
    --shadow-accent: 0 4px 18px rgba(79,70,229,.3);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'Consolas','Cascadia Code','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body {
    font-family:var(--font);
    max-width:1400px;
    margin:20px auto;
    padding:0 16px 24px;
    color:var(--c-text);
    background:var(--c-bg);
  }
  .page-header{margin:6px 0 18px;display:flex;align-items:center;gap:9px;}
  .page-header .icon{color:var(--c-accent);font-size:22px;line-height:1;}
  .agent-user{
    margin-left:auto;display:flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;color:var(--c-text-muted);
    background:var(--c-surface);padding:6px 12px;border-radius:20px;
    box-shadow:var(--shadow-sm);
  }
  .agent-user .dot{width:7px;height:7px;border-radius:50%;background:var(--c-success);flex-shrink:0;}
  .logout-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,20,30,.55);
    z-index:999;align-items:center;justify-content:center;
  }
  .logout-overlay .box{
    background:var(--c-surface);border-radius:14px;padding:32px 28px;
    text-align:center;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .logout-overlay .box .icon{font-size:30px;}
  .logout-overlay .box p{font-size:13.5px;color:var(--c-text-muted);margin:10px 0 0;}
  h1 {
    font-size:22px;font-weight:800;color:#1a1a2e;letter-spacing:-.2px;margin:0;
  }
  p.hint {
    color:var(--c-text-soft);
    margin:0 0 16px;
    font-size:13px;
  }
  .card{
    background:var(--c-surface);border-radius:12px;box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .card-body{padding:12px 16px;}
  textarea {
    width:100%;
    height:110px;
    padding:9px 14px;
    font-size:13px;
    font-family:var(--font);
    color:var(--c-text);
    border:1px solid var(--c-border);
    border-radius:9px;
    background:var(--c-surface);
    resize:vertical;
    outline:none;
    transition:all 150ms;
  }
  textarea::placeholder{color:#aaaaaa;}
  textarea:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-glow);}
  .row {
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  button {
    padding:11px 26px;border-radius:9px;border:none;
    background:var(--c-accent);
    color:#ffffff;font-size:12.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px;
    cursor:pointer;transition:all 150ms;
    box-shadow:var(--shadow-accent);
  }
  button:hover:not(:disabled){background:var(--c-accent-hover);transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(79,70,229,.45);}
  button:disabled {
    opacity:.65;cursor:wait;transform:none;
  }
  .btn-secondary{
    background:var(--c-surface);color:var(--c-text);
    border:1px solid var(--c-border);box-shadow:none;
  }
  .btn-secondary:hover:not(:disabled){background:var(--c-surface-2);border-color:var(--c-accent);
    transform:none;box-shadow:none;}
  .card.mt{margin-top:12px;}
  #status {
    font-size:12.5px;
    color:var(--c-text-muted);
    white-space:pre-wrap;
    word-break:break-word;
    font-weight:500;
  }
  .results-wrap{
    background:var(--c-surface);border-radius:12px;box-shadow:var(--shadow-sm);
    margin-top:16px;
    overflow-x:auto;
    max-width:100%;
  }
  table {
    width:100%;
    border-collapse:collapse;
    font-size:11.5px;
    font-family:var(--font);
  }
  thead tr{background:var(--c-accent);}
  th {
    color:#ffffff;font-size:10px;font-weight:700;letter-spacing:.3px;
    text-transform:uppercase;padding:6px 8px;text-align:left;
    border-right:1px solid rgba(255,255,255,.18);
    white-space:nowrap;
  }
  td {
    padding:5px 8px;
    border-right:1px solid var(--c-border);
    border-bottom:1px solid var(--c-border);
    vertical-align:top;color:var(--c-text);
    max-width:220px;
  }
  tbody tr:nth-child(odd) {background:var(--c-surface);}
  tbody tr:nth-child(even){background:var(--c-surface-2);}
  tbody tr:hover{background:rgba(79,70,229,.06);box-shadow:inset 3px 0 0 var(--c-accent);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-name{font-weight:700;color:var(--c-text);}
  .cell-mobile{
    font-family:var(--font-mono);font-size:12px;
    background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);
    padding:1px 7px;border-radius:5px;letter-spacing:.2px;
    display:inline-block;color:#0d9668;font-weight:700;
  }
  .cell-dob{
    font-family:var(--font-mono);font-size:12px;
    color:#ffffff;font-weight:700;letter-spacing:.2px;
    background:var(--c-accent);padding:1px 7px;border-radius:5px;
    display:inline-block;
  }
  .cell-empty{color:#aaaaaa;}
  .error-row td { color:var(--c-danger); }
  .error-row .cell-name::before{
    content:"Not found";
    font-weight:700;
  }
  .results-toolbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-bottom:1px solid var(--c-border);
    background:var(--c-surface-2);
  }
  .results-toolbar .count{font-size:12px;color:var(--c-text-muted);font-weight:600;}
  .btn-sm{padding:7px 16px;font-size:11px;}
  .progress-wrap{margin-top:12px;display:none;}
  .progress-track{
    height:8px;border-radius:6px;background:var(--c-surface-2);
    overflow:hidden;border:1px solid var(--c-border);
  }
  .progress-fill{
    height:100%;border-radius:6px;background:var(--c-accent);
    width:0%;transition:width .4s ease;
  }
  .progress-fill.indeterminate{
    width:100%;
    background:repeating-linear-gradient(45deg, var(--c-accent) 0 12px, var(--c-accent-hover) 12px 24px);
    background-size:34px 100%;
    animation:progress-stripes 1s linear infinite;
  }
  @keyframes progress-stripes{
    from{background-position:0 0;}
    to{background-position:-34px 0;}
  }
  .progress-meta{
    display:flex;justify-content:space-between;margin-top:6px;
    font-size:11.5px;color:var(--c-text-soft);
  }
</style>
</head>
<body>

<div class="page-header">
  <i class="icon">⛽</i>
  <h1>LPG Bulk Search</h1>
  <span class="agent-user" id="agentUser" style="display:none;">
    <span class="dot"></span>
    <span id="agentUserName"></span>
  </span>
</div>

<div class="logout-overlay" id="logoutOverlay">
  <div class="box">
    <div class="icon">🔒</div>
    <div style="font-weight:700;color:var(--c-text);margin-top:8px">Signed out</div>
    <p id="logoutMessage">You have been logged out of the CRM.</p>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <p class="hint">Paste several mobile numbers (comma, space, or new line separated, up to 25) — each is looked up against your SDMS account.</p>
    <textarea id="numbersBox" placeholder="9876543210, 9876543211, ..."></textarea>
    <div class="row">
      <button id="searchBtn">Bulk Search</button>
      <button id="clearBtn" class="btn-secondary" type="button">Clear</button>
      <button id="refreshBtn" class="btn-secondary" type="button">Refresh</button>
      <span id="status"></span>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="progressLabel"></span>
        <span id="progressEta"></span>
      </div>
    </div>
  </div>
</div>

<div class="results-wrap" id="resultsWrap" style="display:none;">
  <div class="results-toolbar">
    <span class="count" id="resultsCount"></span>
    <button id="exportBtn" class="btn-secondary btn-sm" type="button">⬇ Export to Excel</button>
  </div>
  <table id="resultsTable">
    <thead>
      <tr>
        <th style="width:36px">#</th>
        <th>Mobile Number</th>
        <th>Alternate Number</th>
        <th>Full Name</th>
        <th>DOB</th>
        <th>Relationship Id</th>
        <th>Address</th>
        <th>Country</th>
        <th>Pin Code</th>
        <th>Urban/Rural</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
const searchBtn = document.getElementById("searchBtn");
const clearBtn = document.getElementById("clearBtn");
const refreshBtn = document.getElementById("refreshBtn");
const exportBtn = document.getElementById("exportBtn");
const numbersBox = document.getElementById("numbersBox");
const statusEl = document.getElementById("status");
const resultsWrap = document.getElementById("resultsWrap");
const resultsBody = document.getElementById("resultsBody");
const resultsCount = document.getElementById("resultsCount");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const progressEta = document.getElementById("progressEta");

let pollTimer = null;
let lastResults = [];
let agentActive = true;
let searchStartedAt = null;

function formatDuration(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

// done/total-based ETA - no backend timing data needed, just this job's own
// observed rate so far (elapsed / done gives an average seconds-per-number,
// projected across whatever's left). Naturally reads as "estimating..."
// while done is still 0 (nothing to average yet), which for a single-number
// search (index.html reuses this same function with total=1) means it just
// stays in that state until the one result lands, then reports the total
// elapsed time - there's no partial progress to interpolate for one item.
function updateProgress(done, total, status) {
  if (!total || (status !== "processing" && status !== "queued" && done === 0)) {
    progressWrap.style.display = "none";
    return;
  }
  progressWrap.style.display = "block";
  const pct = Math.round((done / total) * 100);
  const elapsed = searchStartedAt ? (Date.now() - searchStartedAt) / 1000 : 0;

  if (done === 0) {
    progressFill.classList.add("indeterminate");
    progressFill.style.width = "100%";
    progressEta.textContent = "Estimating time…";
  } else {
    progressFill.classList.remove("indeterminate");
    progressFill.style.width = pct + "%";
    if (done < total) {
      const avgPerItem = elapsed / done;
      progressEta.textContent = `~${formatDuration(avgPerItem * (total - done))} remaining`;
    } else {
      progressEta.textContent = `Done in ${formatDuration(elapsed)}`;
    }
  }
  progressLabel.textContent = `${done} / ${total} searched`;
}

function parseNumbers(raw) {
  return raw
    .split(/[\s,]+/)
    .map(s => s.trim())
    .filter(s => s.length > 0)
    .slice(0, 25);
}

function cell(value, cls) {
  if (!value) return `<td><span class="cell-empty">—</span></td>`;
  return `<td><span class="${cls || ''}">${value}</span></td>`;
}

function renderResults(results) {
  lastResults = results;
  resultsBody.innerHTML = "";
  results.forEach((r, i) => {
    const tr = document.createElement("tr");
    const notFound = !!r["NOT_FOUND"];
    if (notFound) tr.classList.add("error-row");
    tr.innerHTML = `
      <td>${i + 1}</td>
      ${cell(r["Mobile Number"], "cell-mobile")}
      ${cell(r["Alternate Number"], "cell-mobile")}
      <td><span class="cell-name">${notFound ? "" : (r["Full Name"] || "—")}</span></td>
      ${cell(r["DOB"], "cell-dob")}
      <td>${notFound ? "" : (r["Relationship Id"] || "—")}</td>
      <td>${notFound ? "" : (r["Address"] || "—")}</td>
      <td>${notFound ? "" : (r["Country"] || "—")}</td>
      <td>${notFound ? "" : (r["Pin Code"] || "—")}</td>
      <td>${notFound ? "" : (r["Urban/Rural"] || "—")}</td>
    `;
    resultsBody.appendChild(tr);
  });
  resultsWrap.style.display = results.length ? "block" : "none";
  resultsCount.textContent = results.length ? `${results.length} result${results.length === 1 ? "" : "s"}` : "";
  exportBtn.disabled = results.length === 0;
}

function csvEscape(value) {
  const s = (value ?? "").toString();
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportToExcel() {
  if (!lastResults.length) return;
  const headers = ["Mobile Number", "Alternate Number", "Full Name", "DOB", "Relationship Id", "Address", "Country", "Pin Code", "Urban/Rural"];
  const lines = [headers.join(",")];
  lastResults.forEach(r => {
    const notFound = !!r["NOT_FOUND"];
    const row = [
      r["Mobile Number"] || "",
      r["Alternate Number"] || "",
      notFound ? "Not found" : (r["Full Name"] || ""),
      r["DOB"] || "",
      notFound ? "" : (r["Relationship Id"] || ""),
      notFound ? "" : (r["Address"] || ""),
      notFound ? "" : (r["Country"] || ""),
      notFound ? "" : (r["Pin Code"] || ""),
      notFound ? "" : (r["Urban/Rural"] || "")
    ];
    lines.push(row.map(csvEscape).join(","));
  });
  // Leading BOM so Excel (which guesses ANSI otherwise) renders non-ASCII
  // characters correctly instead of mojibake.
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  const a = document.createElement("a");
  a.href = url;
  a.download = `lpg_bulk_search_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
exportBtn.addEventListener("click", exportToExcel);

clearBtn.addEventListener("click", () => {
  if (pollTimer) clearInterval(pollTimer);
  numbersBox.value = "";
  statusEl.textContent = "";
  renderResults([]);
  progressWrap.style.display = "none";
  searchBtn.disabled = !agentActive;
});

refreshBtn.addEventListener("click", () => location.reload());

function poll(jobId) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/lpg/bulk-search/${jobId}`);
      if (!res.ok) throw new Error(`server returned ${res.status}`);
      const data = await res.json();

      // Only one Selenium session (bulk search or login) runs at a time —
      // "queued" means someone else's search/login is running first.
      statusEl.textContent = data.status === "queued"
        ? "Waiting for another search/login to finish…"
        : `Status: ${data.status} (${data.done}/${data.total})`;
      renderResults(data.results);
      updateProgress(data.done, data.total, data.status);

      if (data.status === "completed" || data.status === "failed") {
        clearInterval(pollTimer);
        searchBtn.disabled = false;
        if (data.status === "failed") {
          statusEl.textContent = `Failed: ${data.error || "unknown error"}`;
          progressWrap.style.display = "none";
        }
      }
    } catch (pollErr) {
      clearInterval(pollTimer);
      statusEl.textContent = `Lost connection while checking status: ${pollErr.message}`;
      searchBtn.disabled = false;
      progressWrap.style.display = "none";
    }
  }, 2000);
}

searchBtn.addEventListener("click", async () => {
  const numbers = parseNumbers(numbersBox.value);

  if (numbers.length === 0) {
    statusEl.textContent = "Enter at least one mobile number.";
    return;
  }

  searchBtn.disabled = true;
  statusEl.textContent = "Starting search...";
  renderResults([]);
  searchStartedAt = Date.now();
  updateProgress(0, numbers.length, "processing");

  try {
    const res = await fetch("/api/lpg/bulk-search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ numbers })
    });

    if (!res.ok) {
      const err = await res.json();
      statusEl.textContent = `Error: ${err.error || "could not start search"}`;
      searchBtn.disabled = false;
      progressWrap.style.display = "none";
      return;
    }

    const data = await res.json();
    statusEl.textContent = `Status: processing (0/${numbers.length})`;
    poll(data.jobId);
  } catch (err) {
    // fetch() itself throws on network-level failures (DNS, connection
    // refused/reset, mixed-content block, etc.) — without this catch the
    // button just stays disabled forever with no explanation.
    statusEl.textContent = `Could not reach the server: ${err.message}`;
    searchBtn.disabled = false;
    progressWrap.style.display = "none";
  }
});

// Shows which CRM account this installed copy belongs to, and notices a
// logout in real time (found 2026-07-26) rather than only finding out the
// next time a search is attempted - polls every 10s, same endpoint the
// search itself is gated on (/api/lpg/agent-status -> _check_agent_active()
// in app.py), so this is always consistent with what actually blocks a
// search rather than a separate, potentially-stale signal.
const agentUser = document.getElementById("agentUser");
const agentUserName = document.getElementById("agentUserName");
const logoutOverlay = document.getElementById("logoutOverlay");
const logoutMessage = document.getElementById("logoutMessage");

async function pollAgentStatus() {
  try {
    const res = await fetch("/api/lpg/agent-status");
    const data = await res.json();

    agentActive = !!data.active;
    if (data.active) {
      agentUser.style.display = "flex";
      agentUserName.textContent = data.username || "";
      logoutOverlay.style.display = "none";
      searchBtn.disabled = false;
    } else {
      logoutMessage.textContent = data.reason || "You have been logged out of the CRM.";
      logoutOverlay.style.display = "flex";
      searchBtn.disabled = true;
    }
  } catch (e) {
    // A network hiccup here shouldn't lock the page out - just try again
    // on the next tick rather than showing the overlay on a guess.
  }
}
pollAgentStatus();
setInterval(pollAgentStatus, 10000);
</script>

</body>
</html>
